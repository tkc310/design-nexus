<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まちなか循環バス 時刻表</title>
<meta name="description" content="停留所を選ぶと、次に来る3本のバスの発車時刻と、あと何分かを大きく表示します。平日・土日祝の時刻表と運休のお知らせも見られます。">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@700&family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
:root{
  --board:#FFFFFF;      /* timetable board enamel */
  --enamel:#F3F1EA;     /* board frame / notice ground */
  --ink:#141414;        /* sign lettering, also the action color */
  --ink-soft:#4F4F4F;   /* passed departures */
  --plate:#FFD23F;      /* stop plate yellow, lit next departure */
  --plate-ink:#141414;  /* lettering on the plate, same in both schemes */
  --red:#B42318;        /* 運休 tag */
  --on-ink:#FFFFFF;

  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
  --f-fig:"Atkinson Hyperlegible Mono","BIZ UDPGothic","Hiragino Sans","Yu Gothic",ui-monospace,monospace;

  --fs-tag:.889rem;   /* 16px at base */
  --fs-1:1rem;        /* 18 */
  --fs-2:1.25rem;     /* 22.5 */
  --fs-3:1.5625rem;   /* 28 */
  --fs-4:2.441rem;    /* 44 */
  --fs-5:3.052rem;    /* 55 */

  --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s6:1.5rem; --s8:2rem; --s12:3rem;
  --rule:2px solid var(--ink);
  --r-plate:10px;
  --r-ctl:8px;
  --tap:3.25rem;      /* 58px at base, never under 44px */
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --board:#161616;
    --enamel:#24231F;
    --ink:#F2F0E8;
    --ink-soft:#B9B6AA;
    --red:#FF9A8F;
    --on-ink:#161616;
  }
}
html{font-size:112.5%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.is-large{font-size:137.5%}
html:lang(ja){word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--board);color:var(--ink);
  font-family:var(--f-body);font-size:var(--fs-1);line-height:1.75;letter-spacing:.03em;
  padding:0 max(var(--s4),env(safe-area-inset-right)) max(var(--s12),env(safe-area-inset-bottom)) max(var(--s4),env(safe-area-inset-left));
}
h1,h2,h3{font-family:var(--f-display);font-weight:700;font-synthesis:none;line-height:1.35;margin:0;text-wrap:balance;letter-spacing:.02em;font-feature-settings:"palt"}
p{margin:0}
.fig{font-family:var(--f-fig);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap;overflow-wrap:normal}
.nw{white-space:nowrap}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ---------- buttons ---------- */
button{font:inherit;color:inherit;letter-spacing:inherit}
.btn{
  min-height:var(--tap);padding:var(--s2) var(--s6);border-radius:var(--r-ctl);
  font-weight:700;font-size:var(--fs-1);white-space:nowrap;cursor:pointer;
  border:var(--rule);background:var(--board);color:var(--ink);
  transition:transform 120ms var(--ease-out),background-color 120ms ease;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:var(--on-ink)}
.btn-plate{background:var(--plate-ink);color:var(--plate);border-color:var(--plate-ink)}
.btn-plate:focus-visible{outline-color:var(--plate-ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}

/* ---------- header ---------- */
.top{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s2) var(--s4);
  padding:max(var(--s3),env(safe-area-inset-top)) 0 var(--s3);
}
.service{font-family:var(--f-display);font-weight:700;font-size:var(--fs-2);line-height:1.3}
.service small{display:block;font-family:var(--f-body);font-weight:400;font-size:var(--fs-1);color:var(--ink-soft)}

/* ---------- layout ---------- */
.layout{display:grid;gap:var(--s6);max-width:36rem;margin:0 auto}
.col{display:grid;gap:var(--s6);align-content:start;min-width:0}
.side{display:none}

/* ---------- stop plate (pole sign) ---------- */
.plate{
  background:var(--plate);color:var(--plate-ink);
  border:3px solid var(--plate-ink);border-radius:var(--r-plate);
  padding:var(--s4) var(--s4) var(--s4);
  display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s2);
}
.plate-label{font-size:var(--fs-1);font-weight:700;line-height:1.4}
.plate-name{font-size:min(var(--fs-4),12.5vw);line-height:1.2} /* keeps a 6-character stop name on one line at 320px, also in 文字を大きく */
.plate .btn-plate{margin-top:var(--s2);width:100%}
.plate-sub{font-size:var(--fs-1);font-weight:700}

/* ---------- notice ---------- */
.notice{
  background:var(--enamel);border:var(--rule);border-left:10px solid var(--red);
  padding:var(--s4);display:grid;gap:var(--s2);
}
.notice h2{font-size:var(--fs-2);color:var(--red)}
.notice .here{font-weight:700}
.notice.is-none{border-left-width:2px}
.notice.is-none h2{color:var(--ink)}

/* ---------- next three (board rows, enlarged) ---------- */
.next{border:var(--rule);background:var(--board)}
.next-head{
  display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:0 var(--s4);
  background:var(--ink);color:var(--on-ink);padding:var(--s2) var(--s4);
}
.next-head h2{font-size:var(--fs-2)}
.now{font-size:var(--fs-1);font-weight:700}
.now .fig{font-size:var(--fs-2)}
.today{padding:var(--s2) var(--s4);border-bottom:var(--rule);font-weight:700}
.next-list{list-style:none;margin:0;padding:0}
.dep{
  display:grid;grid-template-columns:minmax(0,1fr);gap:0;
  padding:var(--s3) var(--s4);border-top:var(--rule);
}
.dep:first-child{border-top:0}
.dep .ord{font-weight:700;font-size:var(--fs-1);line-height:1.4}
.dep .when{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 var(--s4)}
.dep .t{font-size:var(--fs-4);line-height:1.15}
.dep .t-unit{font-size:var(--fs-2);font-weight:700;margin-left:.15em}
.dep .wait{font-size:var(--fs-2);font-weight:700;line-height:1.4}
.dep .wait .fig{font-size:var(--fs-3)}
.dep.is-first{background:var(--plate);color:var(--plate-ink)}
.dep.is-first .t{font-size:min(var(--fs-5),17vw)}
.dep.is-first .wait{font-size:min(var(--fs-3),8.5vw)}
.dep.is-first .wait .fig{font-size:min(var(--fs-4),12vw)} /* "あと1時間15分" must fit the lit row at 320px in 文字を大きく */
.dep.is-cancel{padding-block:var(--s2);color:var(--ink-soft)}
.dep.is-cancel .when{gap:0 var(--s3)}
.dep.is-cancel .t{font-size:var(--fs-3);text-decoration:line-through;text-decoration-thickness:3px}
.dep.is-tomorrow .ord::after{content:"(明日)"}
.end{padding:var(--s4);font-size:var(--fs-2);font-weight:700;border-bottom:var(--rule)}

.tag-cancel{
  display:inline-block;background:var(--red);color:var(--on-ink);
  font-family:var(--f-body);font-weight:700;font-size:var(--fs-tag);line-height:1.5;
  padding:0 var(--s2);border-radius:4px;white-space:nowrap;text-decoration:none;letter-spacing:.05em;
}

/* ---------- full timetable board ---------- */
.board{border:var(--rule);gap:0}
.board-head{
  display:grid;gap:var(--s3);padding:var(--s3) var(--s4) var(--s4);
  background:var(--enamel);border-bottom:var(--rule);
}
.board-head h2{font-size:var(--fs-3)}
.board-note{font-weight:700}
.dia{border:0;margin:0;padding:0;min-width:0}
.dia legend{padding:0;font-weight:700;margin-bottom:var(--s1)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:var(--rule);border-radius:var(--r-ctl);overflow:hidden}
.seg-item{position:relative;display:grid}
.seg-item + .seg-item{border-left:var(--rule)}
.seg-item input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg-item label{
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:var(--tap);padding:var(--s2);font-weight:700;font-size:var(--fs-2);white-space:nowrap;
  background:var(--board);color:var(--ink);
}
.seg-item input:checked + label{background:var(--ink);color:var(--on-ink)}
.seg-item input:checked + label::before{content:"";width:.6em;height:.6em;border-radius:50%;background:currentColor}
.seg-item input:focus-visible + label{outline:3px solid var(--ink);outline-offset:-7px;box-shadow:inset 0 0 0 4px var(--on-ink)}

.tt{width:100%;border-collapse:collapse}
.tt th,.tt td{border-top:var(--rule);vertical-align:top}
.tt tbody tr:first-child th,.tt tbody tr:first-child td{border-top:0}
.tt th{
  width:3.75rem;background:var(--ink);color:var(--on-ink);text-align:center;
  padding:var(--s2) var(--s1);font-size:var(--fs-3);line-height:1.3;
}
.tt th .u{font-family:var(--f-body);font-size:var(--fs-tag);display:block;line-height:1.2}
.tt td{padding:var(--s2) var(--s2) var(--s2) var(--s3)} /* two minute chips per hour row stay side by side at 320px in 文字を大きく */
.mins{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--s2)}
.m{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:3.25rem;min-height:2.75rem;padding:0 var(--s1);
  font-size:var(--fs-3);line-height:1.2;border:2px solid transparent;border-radius:6px;
}
.m.is-past{color:var(--ink-soft)}
.m.is-next{background:var(--plate);color:var(--plate-ink);border-color:var(--plate-ink)}
.m.is-cancel s{text-decoration-thickness:3px;color:var(--ink-soft)}
.m .lbl{font-family:var(--f-body);font-size:var(--fs-tag);font-weight:700;line-height:1.4;letter-spacing:.05em}
.tt tr.is-past-hour th{background:var(--enamel);color:var(--ink-soft)}

/* ---------- route list (dialog + side column) ---------- */
.route{list-style:none;margin:0;padding:0}
.route li{position:relative}
.route li::before{ /* the route line between stops */
  content:"";position:absolute;left:calc(var(--s4) + .55rem);top:0;bottom:0;width:4px;background:var(--ink);
}
.route li:first-child::before{top:50%}
.route li:last-child::before{bottom:50%}
.stop{
  position:relative;display:grid;grid-template-columns:1.5rem minmax(0,1fr) auto;align-items:center;gap:var(--s3);
  width:100%;min-height:var(--tap);padding:var(--s2) var(--s4);text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:2px solid var(--enamel);font-size:var(--fs-2);font-weight:700;
}
.stop-dot{width:1.5rem;height:1.5rem;border-radius:50%;border:4px solid var(--ink);background:var(--board);justify-self:center}
.stop[aria-current="true"]{background:var(--plate);color:var(--plate-ink)}
.stop[aria-current="true"] .stop-dot{background:var(--plate-ink);border-color:var(--plate-ink)}
.stop-cur{font-size:var(--fs-tag);white-space:nowrap}
.stop:focus-visible{outline-offset:-4px}
@media (hover:hover) and (pointer:fine){
  .stop:hover:not([aria-current="true"]){background:var(--enamel)}
  .btn:hover{background:var(--enamel)}
  .btn-primary:hover,.btn[aria-pressed="true"]:hover{background:var(--ink-soft);border-color:var(--ink-soft)}
  .btn-plate:hover{background:var(--plate-ink)}
}

dialog{
  width:min(32rem,100vw);max-width:100vw;max-height:100dvh;margin:auto;padding:0;
  border:var(--rule);background:var(--board);color:var(--ink);
}
dialog::backdrop{background:rgb(0 0 0 / .55)}
dialog[open]{animation:dlg-in 220ms var(--ease-out)}
@keyframes dlg-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.dlg-head{
  position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
  padding:var(--s3) var(--s4);background:var(--ink);color:var(--on-ink);
}
.dlg-head h2{font-size:var(--fs-2)}
.dlg-head .btn{border-color:var(--on-ink);background:var(--ink);color:var(--on-ink)}
.dlg-head .btn:focus-visible{outline-color:var(--on-ink)}
.side h2{font-size:var(--fs-2);background:var(--ink);color:var(--on-ink);padding:var(--s2) var(--s4)}
.side{border:var(--rule);align-self:start}

@media (prefers-reduced-motion: reduce){
  dialog[open]{animation:dlg-fade 160ms linear}
  @keyframes dlg-fade{from{opacity:0}to{opacity:1}}
  .btn{transition:background-color 120ms ease}
  .btn:active{transform:none}
}

/* ---------- wider screens ---------- */
@media (min-width:900px){
  body{padding-left:var(--s8);padding-right:var(--s8)}
  .top{max-width:70rem;margin:0 auto}
  .layout{max-width:70rem;grid-template-columns:minmax(0,30rem) minmax(0,1fr);align-items:start}
}
@media (min-width:1600px){
  .top{max-width:94rem}
  .layout{max-width:94rem;grid-template-columns:20rem minmax(0,30rem) minmax(0,1fr)}
  .side{display:block}
  /* the side column lists every stop, so the plate's button is a duplicate here */
  .plate .btn-plate{display:none}
}
</style>
</head>
<body>
<header class="top">
  <p class="service">まちなか循環バス<small>時刻表</small></p>
  <button type="button" class="btn" id="size-btn" aria-pressed="false">文字を大きく</button>
</header>

<div class="layout">
  <aside class="side" aria-labelledby="side-h">
    <h2 id="side-h">停留所を選ぶ</h2>
    <ol class="route" id="route-side"></ol>
  </aside>

  <main class="col" id="main">
    <section class="plate" aria-labelledby="stop-name">
      <p class="plate-label">のりば</p>
      <h1 class="plate-name" id="stop-name">中央病院前</h1>
      <p class="plate-sub">循環・<span class="nw">中央駅前ゆき</span></p>
      <button type="button" class="btn btn-plate" id="open-stops" aria-haspopup="dialog">停留所を変える</button>
    </section>

    <section class="next" aria-labelledby="next-h">
      <div class="next-head">
        <h2 id="next-h">つぎのバス</h2>
        <p class="now">いま <span class="fig" id="now-time">--:--</span></p>
      </div>
      <p class="today" id="today"></p>
      <div id="next-body"></div>
    </section>

    <section class="notice" id="notice" aria-labelledby="notice-h">
      <h2 id="notice-h">運休のお知らせ</h2>
      <div id="notice-body"></div>
    </section>
  </main>

  <section class="col board" aria-labelledby="board-h">
    <div class="board-head">
      <h2 id="board-h">きょうの時刻表</h2>
      <fieldset class="dia">
        <legend>ダイヤを選ぶ</legend>
        <div class="seg">
          <div class="seg-item"><input type="radio" name="dia" id="dia-weekday" value="weekday"><label for="dia-weekday">平日</label></div>
          <div class="seg-item"><input type="radio" name="dia" id="dia-holiday" value="holiday"><label for="dia-holiday">土日祝</label></div>
        </div>
      </fieldset>
      <p class="board-note" id="board-note"></p>
    </div>
    <p class="vh" id="tt-cap"></p>
    <table class="tt" aria-labelledby="tt-cap">
      <tbody id="tt-body"></tbody>
    </table>
  </section>
</div>

<dialog id="stops-dlg" aria-labelledby="dlg-h">
  <div class="dlg-head">
    <h2 id="dlg-h">停留所を選ぶ</h2>
    <button type="button" class="btn" id="close-stops">閉じる</button>
  </div>
  <ol class="route" id="route-dlg"></ol>
</dialog>

<p class="vh" role="status" id="live"></p>

<script>
(function(){
  "use strict";

  /* Loop route: minutes after leaving 中央駅前 */
  var STOPS = [
    {id:"chuo-eki",   name:"中央駅前",         off:0},
    {id:"honmachi",   name:"本町商店街",       off:4},
    {id:"shiyakusho", name:"市役所前",         off:8},
    {id:"toshokan",   name:"図書館・公民館前", off:11},
    {id:"byoin",      name:"中央病院前",       off:15},
    {id:"sakuradai",  name:"さくら台団地",     off:20},
    {id:"minamisho",  name:"南小学校前",       off:24},
    {id:"taiikukan",  name:"総合体育館",       off:28},
    {id:"kawazoi",    name:"川沿い公園",       off:32},
    {id:"higashi",    name:"東町郵便局前",     off:36}
  ];
  /* Departures from 中央駅前 */
  var BASE = {
    weekday:["6:50","7:30","8:10","8:50","9:30","10:10","10:50","11:30","12:30","13:30","14:10","14:50","15:30","16:10","16:50","17:30","18:10","18:50"],
    holiday:["8:00","9:00","10:00","11:00","13:00","14:00","15:00","16:00","17:00"]
  };
  var DIA_NAME = {weekday:"平日", holiday:"土日祝"};
  var HOLIDAYS = ["2026-11-03","2026-11-23","2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-22"];
  /* Notices: date, and departures from 中央駅前 that do not run */
  var NOTICES = [
    {date:"2026-11-04", cancel:["10:50"], reason:"道路工事のため"}
  ];
  var WD = "日月火水木金土";

  function toMin(s){ var p = s.split(":"); return (+p[0])*60 + (+p[1]); }
  function pad(n){ return (n<10?"0":"") + n; }
  function hm(min){ return Math.floor(min/60) + ":" + pad(min%60); }
  function jhm(min){ return Math.floor(min/60) + "時" + pad(min%60) + "分"; }
  function dateKey(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function jdate(d){ return (d.getMonth()+1) + "月" + d.getDate() + "日(" + WD[d.getDay()] + ")"; }
  function diaOf(d){
    var w = d.getDay();
    return (w===0 || w===6 || HOLIDAYS.indexOf(dateKey(d))>=0) ? "holiday" : "weekday";
  }
  function noticesOn(d){ var k = dateKey(d); return NOTICES.filter(function(n){ return n.date===k; }); }
  function cancelledOn(d){
    var set = {};
    noticesOn(d).forEach(function(n){ n.cancel.forEach(function(c){ set[toMin(c)] = true; }); });
    return set;
  }
  /* departures at a stop for a dia; cancellations applied only when `day` is given */
  function trips(dia, stop, day){
    var cx = day ? cancelledOn(day) : {};
    return BASE[dia].map(function(s){
      var b = toMin(s);
      return {min:b + stop.off, cancelled:!!cx[b]};
    });
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function waitHTML(mins){
    if (mins <= 1) return '<span class="wait">まもなく発車</span>';
    var h = Math.floor(mins/60), m = mins%60, out = "あと";
    if (h) out += '<span class="fig">' + h + '</span>時間';
    if (m || !h) out += '<span class="fig">' + m + '</span>分';
    return '<span class="wait nw">' + out + '</span>';
  }

  var store = {
    get:function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set:function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };

  var state = {
    stop: STOPS.filter(function(s){ return s.id===store.get("dn-bus-stop"); })[0] || STOPS[4],
    dia: null,
    diaTouched: false
  };

  var $ = function(id){ return document.getElementById(id); };

  /* ---------- route lists ---------- */
  function renderRoute(el){
    el.innerHTML = STOPS.map(function(s){
      var cur = s.id===state.stop.id;
      return '<li><button type="button" class="stop" data-id="' + s.id + '"' + (cur?' aria-current="true"':'') + '>' +
        '<span class="stop-dot" aria-hidden="true"></span><span class="stop-name">' + esc(s.name) + '</span>' +
        (cur ? '<span class="stop-cur">選択中</span>' : '<span></span>') + '</button></li>';
    }).join("");
  }

  /* ---------- notice ---------- */
  function renderNotice(now){
    var list = noticesOn(now), box = $("notice"), body = $("notice-body");
    if (!list.length){
      box.classList.add("is-none");
      $("notice-h").textContent = "お知らせ";
      body.innerHTML = "<p>きょう(" + jdate(now) + ")の運休はありません。</p>";
      return;
    }
    box.classList.remove("is-none");
    $("notice-h").textContent = "運休のお知らせ";
    var dia = diaOf(now), html = "";
    list.forEach(function(n){
      var base = n.cancel.map(function(c){ return '<span class="nw">' + jhm(toMin(c)) + '</span>'; }).join("、");
      html += "<p>" + jdate(now) + "は" + esc(n.reason) + "、中央駅前を" + base + "に出る便を運休します。</p>";
    });
    var here = trips(dia, state.stop, now).filter(function(t){ return t.cancelled; })
      .map(function(t){ return '<span class="nw fig">' + hm(t.min) + '</span>発'; });
    if (here.length && state.stop.off !== 0){
      html += '<p class="here">' + esc(state.stop.name) + "では " + here.join("、") + " が運休です。</p>";
    }
    body.innerHTML = html;
  }

  /* ---------- next three ---------- */
  function renderNext(now){
    var nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
    $("now-time").textContent = now.getHours() + ":" + pad(now.getMinutes());
    var dia = diaOf(now);
    $("today").textContent = jdate(now) + "・" + DIA_NAME[dia] + "ダイヤ";

    var upcoming = trips(dia, state.stop, now)
      .filter(function(t){ return t.min > nowMin; })
      .map(function(t){ return {min:t.min, cancelled:t.cancelled, wait:Math.floor(t.min - nowMin), tomorrow:false}; });
    var running = upcoming.filter(function(t){ return !t.cancelled; }).length;
    if (running < 3){
      var tm = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
      trips(diaOf(tm), state.stop, tm).forEach(function(t){
        upcoming.push({min:t.min, cancelled:t.cancelled, wait:Math.floor(t.min + 1440 - nowMin), tomorrow:true});
      });
    }
    var rows = [], count = 0, ords = ["つぎ","その次","3本目"];
    for (var i=0; i<upcoming.length && count<3; i++){
      var t = upcoming[i];
      if (t.cancelled){
        rows.push('<li class="dep is-cancel"><span class="when"><span class="fig t">' + hm(t.min) + '</span><span class="tag-cancel">運休</span></span></li>');
        continue;
      }
      rows.push('<li class="dep' + (count===0?' is-first':'') + (t.tomorrow?' is-tomorrow':'') + '">' +
        '<span class="ord">' + ords[count] + '</span>' +
        '<span class="when"><span class="nw"><span class="fig t">' + hm(t.min) + '</span><span class="t-unit">発</span></span>' +
        waitHTML(t.wait) + '</span></li>');
      count++;
    }
    var endMsg = (running === 0) ? '<p class="end">きょうの運行は終わりました。明日の始発からご案内します。</p>' : "";
    $("next-body").innerHTML = endMsg + '<ol class="next-list">' + rows.join("") + "</ol>";
  }

  /* ---------- full board ---------- */
  function renderBoard(now){
    var todayDia = diaOf(now), dia = state.dia || todayDia, isToday = dia === todayDia;
    $("dia-" + dia).checked = true;
    $("board-h").textContent = isToday ? "きょうの時刻表" : DIA_NAME[dia] + "の時刻表";
    $("board-note").textContent = isToday
      ? state.stop.name + "の発車時刻です。"
      : "きょうは" + DIA_NAME[todayDia] + "ダイヤです。" + DIA_NAME[dia] + "の時刻を表示しています。";
    $("tt-cap").textContent = state.stop.name + " " + DIA_NAME[dia] + "の発車時刻";

    var nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
    var list = trips(dia, state.stop, isToday ? now : null);
    var nextMin = null;
    if (isToday){ for (var i=0;i<list.length;i++){ if (!list[i].cancelled && list[i].min > nowMin){ nextMin = list[i].min; break; } } }

    var byHour = {}, hours = [];
    list.forEach(function(t){
      var h = Math.floor(t.min/60);
      if (!byHour[h]){ byHour[h] = []; hours.push(h); }
      byHour[h].push(t);
    });
    $("tt-body").innerHTML = hours.map(function(h){
      var pastHour = isToday && (h+1)*60 <= nowMin;
      var cells = byHour[h].map(function(t){
        var mm = pad(t.min%60);
        if (t.cancelled) return '<li class="m fig is-cancel"><s>' + mm + '</s><span class="lbl tag-cancel">運休</span></li>';
        if (t.min === nextMin) return '<li class="m fig is-next">' + mm + '<span class="lbl">つぎ</span></li>';
        if (isToday && t.min <= nowMin) return '<li class="m fig is-past">' + mm + '<span class="vh">(発車済み)</span></li>';
        return '<li class="m fig">' + mm + '</li>';
      }).join("");
      return '<tr' + (pastHour?' class="is-past-hour"':'') + '><th scope="row"><span class="fig">' + h + '</span><span class="u">時</span></th>' +
        '<td><ul class="mins">' + cells + '</ul></td></tr>';
    }).join("");
  }

  function renderAll(){
    var now = new Date();
    $("stop-name").textContent = state.stop.name;
    document.title = state.stop.name + "|まちなか循環バス 時刻表";
    renderNotice(now);
    renderNext(now);
    renderBoard(now);
    renderRoute($("route-dlg"));
    renderRoute($("route-side"));
  }

  /* ---------- events ---------- */
  var dlg = $("stops-dlg"), opener = $("open-stops");
  opener.addEventListener("click", function(){
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open","");
    var cur = dlg.querySelector('.stop[aria-current="true"]');
    if (cur) cur.focus();
  });
  $("close-stops").addEventListener("click", function(){ dlg.close ? dlg.close() : dlg.removeAttribute("open"); });
  dlg.addEventListener("close", function(){ opener.focus(); });
  dlg.addEventListener("click", function(e){ if (e.target === dlg) dlg.close(); });

  function onPick(e){
    var b = e.target.closest(".stop");
    if (!b) return;
    var s = STOPS.filter(function(x){ return x.id === b.getAttribute("data-id"); })[0];
    if (!s) return;
    state.stop = s;
    store.set("dn-bus-stop", s.id);
    renderAll();
    $("live").textContent = s.name + "の時刻を表示しています。";
    if (dlg.open) dlg.close();
    else { var again = document.querySelector('#route-side .stop[data-id="' + s.id + '"]'); if (again) again.focus(); }
  }
  $("route-dlg").addEventListener("click", onPick);
  $("route-side").addEventListener("click", onPick);

  Array.prototype.forEach.call(document.querySelectorAll('input[name="dia"]'), function(r){
    r.addEventListener("change", function(){
      state.dia = r.value;
      renderBoard(new Date());
      $("live").textContent = DIA_NAME[r.value] + "の時刻表を表示しています。";
    });
  });

  var sizeBtn = $("size-btn");
  function applySize(on){
    document.documentElement.classList.toggle("is-large", on);
    sizeBtn.setAttribute("aria-pressed", on ? "true" : "false");
  }
  applySize(store.get("dn-bus-large") === "1");
  sizeBtn.addEventListener("click", function(){
    var on = sizeBtn.getAttribute("aria-pressed") !== "true";
    applySize(on);
    store.set("dn-bus-large", on ? "1" : "0");
  });

  renderAll();
  var lastDay = dateKey(new Date());
  setInterval(function(){
    var now = new Date();
    if (dateKey(now) !== lastDay){ lastDay = dateKey(now); state.dia = null; renderAll(); return; }
    renderNotice(now); renderNext(now); renderBoard(now);
  }, 20000);
})();
</script>
</body>
</html>
