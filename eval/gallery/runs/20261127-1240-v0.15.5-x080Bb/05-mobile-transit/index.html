<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゆずっこ号 時刻表</title>
<meta name="description" content="柚ノ木市コミュニティバス「ゆずっこ号」の停留所別時刻表。次のバスまであと何分かと、当日の全時刻を大きな文字で表示します。">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Lexend:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FFFFFF;
  --ink: #1B1B1B;
  --ink-soft: #555555;
  --livery: #FFC400;
  --on-livery: #1B1B1B;
  --stop-red: #B3001B;
  --plate-ink: var(--ink);
  --plate-text: var(--paper);

  --font-display: "Lexend", "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;

  /* scale 1.333 from 18px */
  --t-0: 1rem;      /* 16px: legend only */
  --t-1: 1.125rem;  /* 18px body */
  --t-2: 1.5rem;    /* 24px */
  --t-3: 2rem;      /* 32px */
  --t-4: 2.625rem;  /* 42px */
  --t-5: 3.5rem;    /* 56px */

  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px;
  --rule: 2px;
  --radius: 6px;
  --tap: 56px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151515;
    --ink: #F3F3EF;
    --ink-soft: #B5B5AF;
    --stop-red: #FF7A7A;
    --plate-ink: #F3F3EF;
    --plate-text: #151515;
  }
}
html { font-size: 100%; -webkit-text-size-adjust: 100%; }
html[data-size="large"] { font-size: 125%; }
html:lang(ja) { word-break: auto-phrase; line-break: strict; overflow-wrap: anywhere; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--t-1);
  line-height: 1.7;
  letter-spacing: 0.02em;
}
h1, h2, h3 { line-height: 1.3; text-wrap: balance; margin: 0; font-feature-settings: "palt"; }
p { margin: 0; text-wrap: pretty; }
.nw { white-space: nowrap; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: 0; overflow-wrap: normal; white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* ---------- header ---------- */
.top {
  border-bottom: var(--rule) solid var(--ink);
  padding: var(--s-3) max(var(--s-4), env(safe-area-inset-right)) var(--s-3) max(var(--s-4), env(safe-area-inset-left));
}
.top-in { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s-2) var(--s-4); }
.brand { display: flex; align-items: center; gap: var(--s-3); }
.brand h1 { font-size: var(--t-2); }
.brand small { display: block; font-size: var(--t-0); font-weight: 400; color: var(--ink); }

.size { display: flex; align-items: center; gap: var(--s-2); }
.size-label { font-size: var(--t-0); }
.seg { display: inline-flex; border: var(--rule) solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.seg button + button { border-left: var(--rule) solid var(--ink); }

button {
  font: inherit; color: var(--ink); background: var(--paper);
  border: 0; min-height: 48px; padding: 0 var(--s-4); cursor: pointer;
  white-space: nowrap; transition: background-color .15s ease, transform .12s ease;
}
button[aria-pressed="true"] { background: var(--livery); color: var(--on-livery); font-weight: 700; }
@media (hover: hover) and (pointer: fine) {
  button[aria-pressed="false"]:hover, .stop-btn:hover { background: color-mix(in srgb, var(--ink) 8%, var(--paper)); }
}
button:active { transform: scale(0.97); }
@media (prefers-reduced-motion: reduce) { button { transition: none; } button:active { transform: none; } }
.seg button:focus-visible { outline-offset: -5px; }

/* ---------- layout ---------- */
main { max-width: 1200px; margin: 0 auto; padding: var(--s-4) max(var(--s-4), env(safe-area-inset-right)) var(--s-7) max(var(--s-4), env(safe-area-inset-left)); }
.cols { display: grid; gap: var(--s-6); }
.cols > * { min-width: 0; }
.stack { display: grid; gap: var(--s-5); align-content: start; }
@media (min-width: 640px) { main { max-width: 680px; } }
@media (min-width: 1000px) {
  main { max-width: 1200px; padding-top: var(--s-6); }
  .cols { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--s-7); align-items: start; }
  .timetable { grid-column: 2; grid-row: 1 / span 2; }
  .route { grid-column: 1; grid-row: 2; }
}
@media (min-width: 1600px) {
  main, .top-in { max-width: 1640px; }
  .cols { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr) minmax(0, 4fr); }
  .timetable { grid-column: 2; grid-row: 1; }
  .route { grid-column: 3; grid-row: 1; }
}

/* ---------- picker ---------- */
.field { display: grid; gap: var(--s-2); }
.field-label { font-size: var(--t-1); font-weight: 700; }
.select-wrap { position: relative; }
.select-wrap::after {
  content: ""; position: absolute; right: 20px; top: 50%; width: 12px; height: 12px;
  border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
  transform: translateY(-70%) rotate(45deg); pointer-events: none;
}
select {
  width: 100%; min-height: 64px; appearance: none; -webkit-appearance: none;
  font: inherit; font-size: var(--t-2); font-weight: 700; color: var(--ink); background: var(--paper);
  border: var(--rule) solid var(--ink); border-radius: var(--radius);
  padding: var(--s-2) 52px var(--s-2) var(--s-4); cursor: pointer;
}
.dir { display: grid; gap: var(--s-2); }
.dir-btns { display: grid; grid-template-columns: 1fr; gap: var(--s-2); }
@media (min-width: 400px) { .dir-btns { grid-template-columns: 1fr 1fr; } }
.dir-btns button {
  min-height: var(--tap); border: var(--rule) solid var(--ink); border-radius: var(--radius);
  text-align: left; padding: var(--s-2) var(--s-4); white-space: normal; line-height: 1.35;
}
.dir-btns .to { font-size: var(--t-0); display: block; font-weight: 400; }

/* ---------- signature: the 時｜分 plate ---------- */
.plate {
  display: grid; grid-template-columns: 5.5rem minmax(0, 1fr);
  border: var(--rule) solid var(--ink); border-radius: var(--radius); overflow: hidden;
}
.plate + .plate { margin-top: calc(var(--rule) * -1); border-top-left-radius: 0; border-top-right-radius: 0; }
.plate:has(+ .plate) { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.plate-h {
  border-right: var(--rule) solid var(--ink); padding: var(--s-3) var(--s-2);
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  font-weight: 700; line-height: 1.3;
}
.plate-b { padding: var(--s-3) var(--s-4); min-width: 0; }

.now-line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 var(--s-3); margin-bottom: var(--s-3); }
.now-line h2 { font-size: var(--t-2); }
.now-line p { font-size: var(--t-1); }

.next .plate-h { font-size: var(--t-1); }
.next .plate-h .num { font-size: var(--t-2); font-weight: 700; }
.dep { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0 var(--s-3); }
.dep-at { font-size: var(--t-2); font-weight: 700; line-height: 1.25; }
.dep-at .num { font-size: var(--t-3); }
.dep-left { font-weight: 700; line-height: 1.15; white-space: nowrap; }
.dep-left .num { font-size: var(--t-4); }
.dep-left .u { font-size: var(--t-2); }
.plate.first { background: var(--plate-ink); color: var(--plate-text); border-color: var(--plate-ink); }
.plate.first .plate-h { border-right-color: var(--plate-text); }
.plate.first .dep-left .num { font-size: var(--t-5); }
.dep-left.long .num, .plate.first .dep-left.long .num { font-size: var(--t-3); }
@media (max-width: 399px) {
  .plate, .tt-row, .stop-btn { grid-template-columns: 4.25rem minmax(0, 1fr); }
  .plate-b { padding: var(--s-3); }
  .plate-h { padding: var(--s-3) var(--s-1); white-space: nowrap; }
  /* keep 「あと◯分」 of the next bus inside a 320×640 first screen */
  .top { padding-top: var(--s-2); padding-bottom: var(--s-2); }
  main { padding-top: var(--s-3); }
  .stack { gap: var(--s-4); }
  .now-line { margin-bottom: var(--s-2); }
}
.plate.cancel .plate-b { color: var(--stop-red); }
.plate.cancel .dep-at .num { text-decoration: line-through; text-decoration-thickness: 3px; }
.plate.cancel .plate-h { color: var(--stop-red); }
.why { font-size: var(--t-1); color: var(--ink); }
.empty .plate-b p + p { margin-top: var(--s-2); }
.inline-btn {
  margin-top: var(--s-3); min-height: var(--tap); border: var(--rule) solid var(--ink); border-radius: var(--radius); font-weight: 700;
}

/* notice */
.notice .plate-h { color: var(--stop-red); }
.notice h2 { font-size: var(--t-1); color: var(--stop-red); }
.notice ul { margin: var(--s-2) 0 0; padding: 0; list-style: none; display: grid; gap: var(--s-3); }
.notice.calm .plate-h, .notice.calm h2 { color: var(--ink); }

/* ---------- timetable ---------- */
.tt-head { display: grid; gap: var(--s-3); margin-bottom: var(--s-3); }
.tt-head h2 { font-size: var(--t-2); }
.tt-head h2 .stop { display: inline-block; }
.days { display: grid; grid-template-columns: 1fr 1fr; border: var(--rule) solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.days button { min-height: var(--tap); font-size: var(--t-1); }
.days button + button { border-left: var(--rule) solid var(--ink); }
.days .today { font-size: var(--t-0); font-weight: 400; }
.days button:focus-visible { outline-offset: -5px; }

.tt { border: var(--rule) solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.tt-row { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); }
.tt-row + .tt-row { border-top: 1px solid var(--ink); }
.tt-cap { background: var(--ink); color: var(--paper); font-weight: 700; }
.tt-cap > * { padding: var(--s-1) var(--s-4); }
.tt-cap > :first-child { text-align: center; border-right: var(--rule) solid var(--paper); }
.tt-hour {
  border-right: var(--rule) solid var(--ink); display: grid; place-items: center;
  font-size: var(--t-3); font-weight: 700; padding: var(--s-2);
}
.tt-mins { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3); padding: var(--s-2) var(--s-3); }
.m { display: inline-flex; align-items: baseline; gap: var(--s-1); font-size: var(--t-3); font-weight: 500; padding: 0 var(--s-2); border: var(--rule) solid transparent; border-radius: var(--radius); line-height: 1.35; }
.m.past { color: var(--ink-soft); }
.m.past .num { font-weight: 500; }
.m.soon { border-color: var(--ink); font-weight: 700; }
.m.soon .num { font-weight: 700; }
.m.soon.first { background: var(--plate-ink); color: var(--plate-text); border-color: var(--plate-ink); }
.m.cut { color: var(--stop-red); }
.m.cut .num { text-decoration: line-through; text-decoration-thickness: 3px; }
.m .tag { font-size: var(--t-1); font-weight: 700; font-family: var(--font-body); }
.tt-row.past-hour .tt-hour { color: var(--ink-soft); }

.legend { margin: var(--s-3) 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-5); font-size: var(--t-1); }
.legend li { display: flex; align-items: center; gap: var(--s-2); }
.key { font-family: var(--font-display); font-size: var(--t-1); font-weight: 700; padding: 0 var(--s-2); border: var(--rule) solid transparent; border-radius: var(--radius); }
.key.k-soon { border-color: var(--ink); }
.key.k-past { color: var(--ink-soft); font-weight: 500; }
.key.k-cut { color: var(--stop-red); text-decoration: line-through; }
.rev { margin-top: var(--s-3); font-size: var(--t-1); }

/* ---------- route ---------- */
.route h2 { font-size: var(--t-2); margin-bottom: var(--s-1); }
.route > p { margin-bottom: var(--s-3); }
.route ol { list-style: none; margin: 0; padding: 0; }
.route li + li { margin-top: calc(var(--rule) * -1); }
.stop-btn {
  width: 100%; min-height: var(--tap); display: grid; grid-template-columns: 5.5rem minmax(0, 1fr);
  border: var(--rule) solid var(--ink); padding: 0; text-align: left; white-space: normal;
}
.route li:first-child .stop-btn { border-radius: var(--radius) var(--radius) 0 0; }
.route li:last-child .stop-btn { border-radius: 0 0 var(--radius) var(--radius); }
.stop-btn .mins { border-right: var(--rule) solid var(--ink); display: grid; place-items: center; font-weight: 700; padding: var(--s-2); line-height: 1.2; text-align: center; }
.stop-btn .mins .num { font-size: var(--t-2); }
.stop-btn .name { padding: var(--s-2) var(--s-4); align-self: center; line-height: 1.4; }
.stop-btn .name small { display: block; font-size: var(--t-0); }
.stop-btn[aria-current="true"] { background: var(--livery); color: var(--on-livery); font-weight: 700; }
.stop-btn[aria-current="true"] .mins { border-right-color: var(--on-livery); }
.stop-btn.behind { color: var(--ink-soft); }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>ゆずっこ号 時刻表<small>柚ノ木市コミュニティバス</small></h1>
    </div>
    <div class="size" role="group" aria-labelledby="size-label">
      <span class="size-label" id="size-label">文字の大きさ</span>
      <div class="seg">
        <button type="button" data-size="normal" aria-pressed="true">標準</button>
        <button type="button" data-size="large" aria-pressed="false">大きく</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="cols">
    <div class="stack col-a">
      <div class="field">
        <label class="field-label" for="stop">乗る停留所</label>
        <div class="select-wrap">
          <select id="stop"></select>
        </div>
      </div>

      <div class="dir" role="group" aria-labelledby="dir-label">
        <span class="field-label" id="dir-label">行き先</span>
        <div class="dir-btns" id="dir-btns"></div>
      </div>

      <section class="next" aria-labelledby="next-h">
        <div class="now-line">
          <h2 id="next-h">次のバス</h2>
          <p id="now"></p>
        </div>
        <div id="next-list"></div>
      </section>

      <section id="notice" aria-labelledby="notice-h"></section>
    </div>

    <section class="timetable" aria-labelledby="tt-h">
      <div class="tt-head">
        <h2 id="tt-h"></h2>
        <div class="days" role="group" aria-label="ダイヤ">
          <button type="button" data-day="weekday" aria-pressed="true">平日</button>
          <button type="button" data-day="holiday" aria-pressed="false">土日祝</button>
        </div>
      </div>
      <div class="tt" id="tt"></div>
      <ul class="legend">
        <li><span class="key k-soon num">00</span>囲み：次に来る3本</li>
        <li><span class="key k-past num">00</span>薄い数字：発車済み</li>
        <li><span class="key k-cut num">00</span>赤い取り消し線：運休</li>
      </ul>
      <p class="rev">2026年10月1日改正のダイヤです。道路の混み具合で数分遅れることがあります。</p>
    </section>

    <section class="route" aria-labelledby="route-h">
      <h2 id="route-h">停留所と所要時間</h2>
      <p id="route-sub"></p>
      <ol id="route-list"></ol>
    </section>
  </div>
</main>

<script>
(function () {
  var STOPS = [
    { name: '柚ノ木駅前', note: '鉄道のりかえ' },
    { name: '市役所前', note: '' },
    { name: '本町商店街', note: '' },
    { name: '中央病院', note: '正面玄関前' },
    { name: '図書館・公民館', note: '' },
    { name: '東団地', note: '' },
    { name: '南地区センター', note: '' },
    { name: 'ゆずの里温泉', note: '' }
  ];
  var OFF = [0, 4, 8, 13, 17, 22, 27, 33]; // minutes from 柚ノ木駅前 toward ゆずの里温泉
  var LAST = OFF[OFF.length - 1];
  var DIRS = {
    onsen: { to: 'ゆずの里温泉ゆき', via: '中央病院・東団地方面', origin: 0 },
    eki:   { to: '柚ノ木駅前ゆき', via: '市役所前・本町方面', origin: STOPS.length - 1 }
  };
  // Departures from each direction's first stop (HH:MM)
  var TRIPS = {
    weekday: {
      onsen: ['7:05','7:55','8:45','9:40','10:30','11:20','12:10','13:20','14:10','15:00','15:50','16:40','17:30','18:20','19:10'],
      eki:   ['7:00','7:50','8:40','9:35','10:25','11:15','12:05','13:15','14:05','14:55','15:45','16:35','17:25','18:15','19:05']
    },
    holiday: {
      onsen: ['8:15','9:25','10:35','11:45','13:25','14:35','15:45','16:55','18:05'],
      eki:   ['8:10','9:20','10:30','11:40','13:20','14:30','15:40','16:50','18:00']
    }
  };
  // Cancellations, keyed by service date, by the trip's departure from its first stop
  var NOTICES = [
    { date: '2026-11-04', dir: 'eki', trip: '11:15', reason: '車両点検のため' }
  ];
  var HOLIDAYS = ['2026-11-03','2026-11-23','2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-21','2027-03-22','2027-04-29','2027-05-03','2027-05-04','2027-05-05'];
  var WD = ['日','月','火','水','木','金','土'];

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  var state = {
    stop: 3, dir: 'eki', view: null, size: 'normal'
  };
  var s0 = parseInt(store('yz-stop'), 10); if (s0 >= 0 && s0 < STOPS.length) state.stop = s0;
  var d0 = store('yz-dir'); if (d0 === 'eki' || d0 === 'onsen') state.dir = d0;
  var z0 = store('yz-size'); if (z0 === 'large') state.size = 'large';

  function nowJST() {
    var parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short', hourCycle: 'h23' }).formatToParts(new Date());
    var o = {}; parts.forEach(function (p) { o[p.type] = p.value; });
    var wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(o.weekday);
    return { ymd: o.year + '-' + o.month + '-' + o.day, m: +o.month, d: +o.day, wd: wd, min: (+o.hour) * 60 + (+o.minute), hh: +o.hour, mm: +o.minute };
  }
  function dayType(t) { return (t.wd === 0 || t.wd === 6 || HOLIDAYS.indexOf(t.ymd) >= 0) ? 'holiday' : 'weekday'; }
  function toMin(s) { var a = s.split(':'); return (+a[0]) * 60 + (+a[1]); }
  function fmt(m) { var h = Math.floor(m / 60), mm = m % 60; return h + ':' + (mm < 10 ? '0' : '') + mm; }
  function offsetAt(stop, dir) { return dir === 'onsen' ? OFF[stop] : LAST - OFF[stop]; }
  function isTerminal(stop, dir) { return dir === 'onsen' ? stop === STOPS.length - 1 : stop === 0; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function departures(type, stop, dir, ymd) {
    var off = offsetAt(stop, dir);
    return TRIPS[type][dir].map(function (trip) {
      var cut = null;
      NOTICES.forEach(function (n) { if (ymd && n.date === ymd && n.dir === dir && n.trip === trip) cut = n; });
      return { at: toMin(trip) + off, trip: trip, cut: cut };
    });
  }
  function leftHTML(diff) {
    if (diff <= 1) return '<span class="u">まもなく発車</span>';
    var h = Math.floor(diff / 60), m = diff % 60;
    var s = '<span class="u">あと</span>';
    if (h > 0) s += '<span class="num">' + h + '</span><span class="u">時間</span>';
    s += '<span class="num">' + m + '</span><span class="u">分</span>';
    return s;
  }

  var $ = function (id) { return document.getElementById(id); };
  var sel = $('stop');
  STOPS.forEach(function (s, i) { var o = document.createElement('option'); o.value = i; o.textContent = s.name; sel.appendChild(o); });
  sel.addEventListener('change', function () { state.stop = +sel.value; store('yz-stop', state.stop); render(); });

  var dirBox = $('dir-btns');
  ['eki', 'onsen'].forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button'; b.dataset.dir = k;
    b.innerHTML = '<span class="nw">' + DIRS[k].to + '</span><span class="to">' + DIRS[k].via + '</span>';
    b.addEventListener('click', function () { setDir(k); });
    dirBox.appendChild(b);
  });
  function setDir(k) { state.dir = k; store('yz-dir', k); render(); }

  document.querySelectorAll('.days button').forEach(function (b) {
    b.addEventListener('click', function () { state.view = b.dataset.day; render(); });
  });
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () { state.size = b.dataset.size; store('yz-size', state.size); render(); });
  });

  function render() {
    var t = nowJST();
    var today = dayType(t);
    var view = state.view || today;
    var stop = state.stop, dir = state.dir, name = STOPS[stop].name;

    document.documentElement.dataset.size = state.size;
    document.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.size === state.size)); });
    sel.value = stop;
    dirBox.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.dir === dir)); });

    var todayLabel = today === 'weekday' ? '平日' : '土日祝';
    $('now').innerHTML = '<span class="nw">' + t.m + '月' + t.d + '日（' + WD[t.wd] + '）</span> <span class="nw"><span class="num">' + fmt(t.min) + '</span> 現在</span>';

    // ----- next three -----
    var nl = $('next-list');
    var html = '';
    if (isTerminal(stop, dir)) {
      var other = dir === 'onsen' ? 'eki' : 'onsen';
      html = '<div class="plate empty"><div class="plate-h">終点</div><div class="plate-b"><p>' + esc(name) + 'は' + DIRS[dir].to + 'の終点です。ここから乗るときは、反対の行き先を選んでください。</p><button type="button" class="inline-btn" id="flip">' + DIRS[other].to + 'に切り替える</button></div></div>';
      nl.innerHTML = html;
      $('flip').addEventListener('click', function () { setDir(other); });
    } else {
      var deps = departures(today, stop, dir, t.ymd).filter(function (d) { return d.at >= t.min; });
      var shown = 0, rows = [];
      for (var i = 0; i < deps.length && shown < 3; i++) {
        var d = deps[i];
        if (d.cut) { rows.push({ d: d, cut: true }); continue; }
        rows.push({ d: d, n: shown }); shown++;
      }
      if (shown === 0) {
        var first = departures('weekday', stop, dir)[0];
        html = '<div class="plate empty"><div class="plate-h">本日<br>終了</div><div class="plate-b"><p>' + esc(name) + 'から' + DIRS[dir].to + 'のバスは、今日はもうありません。</p><p>平日の始発は <span class="num">' + fmt(first.at) + '</span>発、土日祝の始発は <span class="num">' + fmt(departures('holiday', stop, dir)[0].at) + '</span>発です。</p></div></div>';
      } else {
        var labels = ['次', 'その次', '3本目'];
        rows.forEach(function (r) {
          var at = '<span class="dep-at"><span class="num">' + fmt(r.d.at) + '</span>発</span>';
          if (r.cut) {
            html += '<div class="plate cancel"><div class="plate-h">運休</div><div class="plate-b"><div class="dep">' + at + '<span class="dep-left">この便は運休</span></div><p class="why">' + esc(r.d.cut.reason) + '走りません。</p></div></div>';
          } else {
            var diff = r.d.at - t.min;
            html += '<div class="plate' + (r.n === 0 ? ' first' : '') + '"><div class="plate-h">' + labels[r.n] + '</div><div class="plate-b"><div class="dep">' + at + '<span class="dep-left' + (diff >= 60 ? ' long' : '') + '">' + leftHTML(diff) + '</span></div></div></div>';
          }
        });
        if (shown < 3) html += '<div class="plate"><div class="plate-h">以降</div><div class="plate-b"><p>今日はこのあとのバスはありません。</p></div></div>';
      }
      nl.innerHTML = html;
    }

    // ----- notice -----
    var todays = NOTICES.filter(function (n) { return n.date === t.ymd; });
    var nb = $('notice');
    if (todays.length) {
      nb.className = 'notice plate';
      nb.innerHTML = '<div class="plate-h">運休</div><div class="plate-b"><h2 id="notice-h">運休のお知らせ</h2><ul>' + todays.map(function (n) {
        var oStop = STOPS[DIRS[n.dir].origin].name;
        var day = '<span class="nw">' + t.m + '月' + t.d + '日（' + WD[t.wd] + '）</span>';
        var trip = '<span class="nw">' + esc(oStop) + '</span> <span class="num">' + n.trip + '</span>発 <span class="nw">' + DIRS[n.dir].to + '</span>';
        if (isTerminal(stop, n.dir)) {
          return '<li>' + day + '、' + trip + 'の便は、' + esc(n.reason) + '運休します。</li>';
        }
        // Lead with what it means at the chosen stop, then the buses to take instead.
        var list = departures(today, stop, n.dir, t.ymd);
        var at = toMin(n.trip) + offsetAt(stop, n.dir), prev = null, next = null;
        list.forEach(function (d) { if (d.cut) return; if (d.at < at) prev = d.at; else if (next === null) next = d.at; });
        var alt = [];
        if (prev !== null) alt.push('前の便は <span class="num">' + fmt(prev) + '</span>発');
        if (next !== null) alt.push('次の便は <span class="num">' + fmt(next) + '</span>発');
        return '<li><b>今日の<span class="nw">' + esc(name) + '</span> <span class="num">' + fmt(at) + '</span>発 <span class="nw">' + DIRS[n.dir].to + '</span>は走りません。</b>' + esc(n.reason) + '運休します（' + trip + 'の便）。' + (alt.length ? alt.join('、') + 'です。' : '') + '</li>';
      }).join('') + '</ul></div>';
    } else {
      nb.className = 'notice plate calm';
      nb.innerHTML = '<div class="plate-h">お知らせ</div><div class="plate-b"><h2 id="notice-h">運休のお知らせ</h2><p>今日、運休する便はありません。</p></div>';
    }

    // ----- timetable -----
    document.querySelectorAll('.days button').forEach(function (b) {
      var on = b.dataset.day === view;
      b.setAttribute('aria-pressed', String(on));
      b.innerHTML = (b.dataset.day === 'weekday' ? '平日' : '土日祝') + (b.dataset.day === today ? '<span class="today">（今日）</span>' : '');
    });
    $('tt-h').innerHTML = '<span class="stop nw">' + esc(name) + '</span> <span class="nw">' + DIRS[dir].to + '</span>';
    var tt = $('tt');
    if (isTerminal(stop, dir)) {
      tt.innerHTML = '<div class="tt-row"><div class="tt-hour">―</div><div class="tt-mins"><p>終点のため、この行き先の発車はありません。</p></div></div>';
    } else {
      var isToday = view === today;
      var all = departures(view, stop, dir, isToday ? t.ymd : null);
      var soon = [];
      if (isToday) all.forEach(function (d) { if (d.at >= t.min && !d.cut && soon.length < 3) soon.push(d.at); });
      var byHour = {};
      all.forEach(function (d) { var h = Math.floor(d.at / 60); (byHour[h] = byHour[h] || []).push(d); });
      var out = '<div class="tt-row tt-cap" aria-hidden="true"><span>時</span><span>分</span></div>';
      Object.keys(byHour).sort(function (a, b) { return a - b; }).forEach(function (h) {
        var list = byHour[h];
        var hourPast = isToday && list.every(function (d) { return d.at < t.min; });
        out += '<div class="tt-row' + (hourPast ? ' past-hour' : '') + '"><div class="tt-hour num">' + h + '<span class="sr">時</span></div><div class="tt-mins">';
        list.forEach(function (d) {
          var mm = d.at % 60, mmS = (mm < 10 ? '0' : '') + mm;
          var cls = 'm', extra = '';
          var idx = soon.indexOf(d.at);
          if (d.cut) { cls += ' cut'; extra = '<span class="tag">運休</span>'; }
          else if (isToday && d.at < t.min) { cls += ' past'; extra = '<span class="sr">（発車済み）</span>'; }
          else if (idx >= 0) { cls += ' soon' + (idx === 0 ? ' first' : ''); extra = '<span class="sr">（' + ['次のバス', 'その次', '3本目'][idx] + '）</span>'; }
          out += '<span class="' + cls + '"><span class="num">' + mmS + '</span><span class="sr">分</span>' + extra + '</span>';
        });
        out += '</div></div>';
      });
      tt.innerHTML = out;
    }

    // ----- route -----
    $('route-sub').textContent = DIRS[dir].to + '。' + name + 'から各停留所までのおおよその時間です。「手前」は、このバスが' + name + 'に来るまでに通る停留所です。停留所を押すと、その時刻表に切り替わります。';
    var order = STOPS.map(function (s, i) { return i; });
    if (dir === 'eki') order.reverse();
    var pos = order.indexOf(stop);
    $('route-list').innerHTML = order.map(function (i, k) {
      var cur = i === stop;
      var mins;
      if (cur) mins = 'ここ';
      else if (k < pos) mins = '手前';
      else mins = '<span class="num">' + Math.abs(OFF[i] - OFF[stop]) + '</span>分';
      return '<li><button type="button" class="stop-btn' + (k < pos ? ' behind' : '') + '" data-stop="' + i + '"' + (cur ? ' aria-current="true"' : '') + ' ><span class="mins">' + mins + '</span><span class="name"><span class="nw">' + esc(STOPS[i].name) + '</span>' + (STOPS[i].note ? '<small>' + esc(STOPS[i].note) + '</small>' : '') + '</span></button></li>';
    }).join('');
    $('route-list').querySelectorAll('.stop-btn').forEach(function (b) {
      b.addEventListener('click', function () { state.stop = +b.dataset.stop; store('yz-stop', state.stop); render(); sel.focus(); });
    });
  }

  render();
  var lastMin = nowJST().min;
  setInterval(function () {
    var m = nowJST().min;
    if (m === lastMin) return;
    lastMin = m;
    var a = document.activeElement, keep = a && a.dataset ? (a.dataset.stop || null) : null;
    render();
    if (keep !== null) { var b = document.querySelector('.stop-btn[data-stop="' + keep + '"]'); if (b) b.focus(); }
  }, 15000);
})();
</script>
</body>
</html>
