<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- M-071: draw Japanese system-font stacks with Japanese glyph shapes in the eval container.
     Install: apt-get install -y fonts-noto-cjk && cp eval/env/fonts-ja.conf ~/.config/fontconfig/fonts.conf && fc-cache -f -->
<fontconfig>
  <alias binding="same"><family>Hiragino Sans</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Hiragino Kaku Gothic ProN</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Hiragino Kaku Gothic Pro</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic Medium</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>YuGothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Meiryo</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Hiragino Mincho ProN</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="same"><family>Hiragino Mincho Pro</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="same"><family>Yu Mincho</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="same"><family>YuMincho</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
</fontconfig>
