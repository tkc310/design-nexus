<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ぐるりんバス 時刻表｜みどり台市コミュニティバス</title>
<meta name="description" content="みどり台市コミュニティバス「ぐるりんバス」の時刻表。停留所をえらぶと、次のバスまであと何分かと、きょうの全時刻がわかります。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Overpass:wght@700;800&display=swap">
<style>
/* Tokens: the bus-stop pole timetable plate.
   ink = the plate's printed black; ground = enamel white; panel = aluminium frame;
   signal = tactile-paving yellow (marks the bus to catch); livery = the bus body green;
   stop = the red "運休" sticker the operator pastes over cancelled trips. */
:root {
  --ink: #161616;
  --ground: #FFFFFF;
  --panel: #F3F3F1;
  --muted: #5A5A5A;
  --signal: #FFD100;
  --on-signal: #161616;
  --livery: #00694B;
  --on-livery: #FFFFFF;
  --stop: #B3261E;
  --on-stop: #FFFFFF;
  --focus: var(--ink);

  --f-body: "BIZ UDPGothic", sans-serif;
  --f-fig: "Overpass", "BIZ UDPGothic", sans-serif;

  /* type scale ≈1.25 from an 18px body; 16px is the floor for anything read */
  --t-s: 1rem;
  --t-b: 1.125rem;
  --t-m: 1.375rem;
  --t-l: 1.75rem;
  --t-xl: 2.25rem;
  --t-xxl: 3.5rem;

  /* 4px base */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;

  --r-plate: 12px;
  --r-ctl: 8px;
  --tap: 52px;
  --cell: 8.5rem;
  --hour: 3.75rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #F3F3F1;
    --ground: #121416;
    --panel: #1E2225;
    --muted: #A9ADB0;
    --livery: #0F5A41;
    --on-livery: #F3F3F1;
    --stop: #FF8A80;
    --on-stop: #161616;
  }
}
html { font-size: 100%; -webkit-text-size-adjust: 100%; }
html.is-large { font-size: 125%; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--t-b);
  line-height: 1.7;
  letter-spacing: 0.02em;
  line-break: strict;
  overflow-wrap: anywhere;
}
h1, h2 { line-height: 1.3; text-wrap: balance; word-break: auto-phrase; margin: 0; }
p { margin: 0; text-wrap: pretty; }
.fig { font-family: var(--f-fig); font-variant-numeric: tabular-nums; letter-spacing: 0; white-space: nowrap; overflow-wrap: normal; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* ---------- band: the bus body ---------- */
.band {
  background: var(--livery);
  color: var(--on-livery);
  --focus: var(--signal);
  padding: calc(var(--s3) + env(safe-area-inset-top)) calc(var(--s4) + env(safe-area-inset-right)) var(--s3) calc(var(--s4) + env(safe-area-inset-left));
}
.band-in {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap;
}
.org { font-size: var(--t-s); }
.band h1 { font-size: var(--t-l); font-weight: 700; letter-spacing: 0.04em; }
.size-btn {
  min-height: var(--tap); padding: 0 var(--s4);
  font: 700 var(--t-s)/1.2 var(--f-body);
  color: var(--ink); background: var(--ground);
  border: 2px solid var(--ground); border-radius: var(--r-ctl);
  display: inline-flex; align-items: center; gap: var(--s2);
  white-space: nowrap; cursor: pointer;
  transition: background-color .15s ease, transform .12s ease;
}
.size-btn .box {
  width: 1.25em; height: 1.25em; border: 2px solid var(--ink); border-radius: 4px;
  display: inline-grid; place-items: center; font-size: var(--t-s);
}
.size-btn[aria-pressed="true"] .box::after { content: ""; width: .35em; height: .65em; border: solid var(--ink); border-width: 0 3px 3px 0; transform: translateY(-1px) rotate(45deg); }
.size-btn:active { transform: scale(0.97); }

/* ---------- page layout ---------- */
.wrap {
  max-width: 1200px; margin: 0 auto;
  padding: var(--s4) calc(var(--s4) + env(safe-area-inset-right)) calc(var(--s7) + env(safe-area-inset-bottom)) calc(var(--s4) + env(safe-area-inset-left));
  display: grid; gap: var(--s6);
}
.col-now { display: grid; gap: var(--s6); align-content: start; min-width: 0; }
.col-table { min-width: 0; }
@media (min-width: 720px) {
  .wrap { padding-left: var(--s6); padding-right: var(--s6); }
}
@media (min-width: 960px) {
  .wrap { grid-template-columns: minmax(0, 27rem) minmax(0, 1fr); gap: var(--s7); padding-top: var(--s6); }
  .col-now { position: sticky; top: var(--s5); align-self: start; }
}

h2 { font-size: var(--t-m); font-weight: 700; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2) var(--s4); flex-wrap: wrap; margin-bottom: var(--s3); }

/* ---------- stop picker ---------- */
.pick label { display: block; font-weight: 700; font-size: var(--t-b); margin-bottom: var(--s2); }
.select-wrap { position: relative; }
.select-wrap::after {
  content: ""; position: absolute; right: var(--s5); top: 50%;
  width: 12px; height: 12px; border: solid var(--ink); border-width: 0 3px 3px 0;
  transform: translateY(-70%) rotate(45deg); pointer-events: none;
}
select {
  width: 100%; min-height: 64px;
  padding: var(--s2) var(--s7) var(--s2) var(--s4);
  font: 700 var(--t-l)/1.3 var(--f-body);
  color: var(--ink); background: var(--ground);
  border: 3px solid var(--ink); border-radius: var(--r-ctl);
  appearance: none; -webkit-appearance: none; cursor: pointer;
}
.nowline { margin-top: var(--s3); display: flex; flex-wrap: wrap; gap: 0 var(--s4); align-items: baseline; }
.nowline .clock { font-family: var(--f-fig); font-weight: 800; font-size: var(--t-m); font-variant-numeric: tabular-nums; }
.nowline .dia { font-weight: 700; }

/* ---------- the plate: one unit, three uses ---------- */
.plate {
  list-style: none; margin: 0; padding: 0;
  border: 2px solid var(--ink); border-radius: var(--r-plate);
  overflow: hidden; background: var(--ground);
}
.row {
  display: grid; grid-template-columns: var(--cell) minmax(0, 1fr);
  border-top: 2px solid var(--ink);
}
.row:first-child { border-top: 0; }
.cell {
  padding: var(--s3) var(--s3);
  display: flex; flex-direction: column; justify-content: center;
  border-right: 2px solid var(--ink);
}
.body { padding: var(--s3) var(--s4); display: flex; flex-direction: column; justify-content: center; gap: var(--s1); min-width: 0; }

/* next departures */
.row.go .cell { background: var(--signal); color: var(--on-signal); }
.cd-pre { font-weight: 700; font-size: var(--t-b); line-height: 1.2; }
.cd-val { font-family: var(--f-fig); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: 0; }
.cd-val .u { font-family: var(--f-body); font-weight: 700; font-size: var(--t-b); margin-left: 2px; }
.cd-val .cd-part { display: inline-block; white-space: nowrap; }
.cd-val b { font-size: var(--t-xl); font-weight: 800; }
.cd-soon { font-weight: 700; font-size: var(--t-m); line-height: 1.3; }
.row.go:first-child .cd-val b { font-size: var(--t-xxl); }
.row.go:first-child .cd-val.long b { font-size: var(--t-xl); }
.row.go:first-child { min-height: 7.5rem; }
.dep { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
.dep .t { font-family: var(--f-fig); font-weight: 800; font-size: var(--t-xl); line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: 0; white-space: nowrap; }
.row.go:not(:first-child) .dep .t { font-size: var(--t-l); }
.dep .hatsu { font-weight: 700; }
.tag {
  display: inline-block; padding: 0 var(--s2); border: 2px solid var(--ink); border-radius: 4px;
  font-size: var(--t-s); font-weight: 700; line-height: 1.5; white-space: nowrap;
}
.dest { font-size: var(--t-s); color: var(--ink); }

/* cancelled trip, pasted over like the operator's sticker */
.row.off .cell { background: var(--stop); color: var(--on-stop); align-items: flex-start; }
.off-label { font-weight: 700; font-size: var(--t-m); line-height: 1.2; }
.row.off .t { font-family: var(--f-fig); font-weight: 700; font-size: var(--t-m); text-decoration: line-through; text-decoration-thickness: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.off .why { font-size: var(--t-s); }

.fineprint { margin-top: var(--s3); font-size: var(--t-s); }
.status { margin-bottom: var(--s3); font-weight: 700; }

/* notices */
.row.note .cell { background: var(--stop); color: var(--on-stop); align-items: flex-start; justify-content: flex-start; }
.row.note.change .cell { background: var(--ink); color: var(--ground); }
.row.note .cell span { font-weight: 700; font-size: var(--t-b); line-height: 1.3; word-break: keep-all; overflow-wrap: normal; }
.n-when { font-weight: 700; display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; }
.n-text { font-size: var(--t-b); }
.row.none .cell { background: var(--panel); }
.row.note { grid-template-columns: 7.5rem minmax(0, 1fr); }
@media (max-width: 520px) {
  .row.note { grid-template-columns: 1fr; }
  .row.note .cell { border-right: 0; border-bottom: 2px solid var(--ink); padding: var(--s1) var(--s4); }
}

/* ---------- full timetable ---------- */
.seg {
  display: inline-grid; grid-template-columns: 1fr 1fr;
  border: 2px solid var(--ink); border-radius: var(--r-ctl); overflow: hidden;
  min-width: 15rem;
}
.seg button {
  min-height: var(--tap); padding: 0 var(--s4);
  font: 700 var(--t-b)/1.2 var(--f-body);
  color: var(--ink); background: var(--ground); border: 0; cursor: pointer; white-space: nowrap;
  transition: background-color .15s ease;
}
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.seg button:focus-visible { outline-offset: -6px; outline-color: var(--signal); }
.seg button[aria-pressed="false"]:focus-visible { outline-color: var(--ink); }
.tt-note { margin-bottom: var(--s3); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); margin-bottom: var(--s3); font-size: var(--t-s); }
.legend span { display: inline-flex; align-items: center; gap: var(--s2); white-space: nowrap; }
.key { display: inline-block; font-family: var(--f-fig); font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 var(--s1); border-radius: 4px; line-height: 1.4; }
.key.next { background: var(--signal); color: var(--on-signal); }
.key.past { color: var(--muted); }
.key.off { color: var(--stop); text-decoration: line-through; text-decoration-thickness: 2px; }

table.tt { width: 100%; border-collapse: separate; border-spacing: 0; }
.tt th, .tt td { text-align: left; vertical-align: middle; }
.tt thead th { background: var(--panel); font-size: var(--t-s); font-weight: 700; padding: var(--s1) var(--s3); border-bottom: 2px solid var(--ink); }
.tt thead th:first-child { width: var(--hour); text-align: center; border-right: 2px solid var(--ink); }
.tt tbody th {
  width: var(--hour); background: var(--livery); color: var(--on-livery);
  font-family: var(--f-fig); font-weight: 800; font-size: var(--t-l); font-variant-numeric: tabular-nums;
  text-align: center; border-right: 2px solid var(--ink); border-top: 2px solid var(--ink);
  padding: var(--s2) var(--s1);
}
.tt tbody td { border-top: 2px solid var(--ink); padding: var(--s2) var(--s3); }
.tt tbody tr:first-child th, .tt tbody tr:first-child td { border-top: 0; }
.mins { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); align-items: baseline; }
.m { font-family: var(--f-fig); font-weight: 700; font-size: var(--t-l); line-height: 1.3; font-variant-numeric: tabular-nums; letter-spacing: 0; padding: 0 var(--s1); border-radius: 6px; white-space: nowrap; }
.m.past { color: var(--muted); }
.m.next { background: var(--signal); color: var(--on-signal); font-weight: 800; }
.m.off { color: var(--stop); }
.m.off .n { text-decoration: line-through; text-decoration-thickness: 2px; }
.m.off .w { font-family: var(--f-body); font-size: var(--t-s); font-weight: 700; margin-left: var(--s1); }

.foot { border-top: 2px solid var(--ink); padding-top: var(--s4); display: grid; gap: var(--s2); }
@media (min-width: 960px) { .foot { grid-column: 1 / -1; } }

@media (hover: hover) and (pointer: fine) {
  .seg button[aria-pressed="false"]:hover { background: var(--panel); }
  .size-btn:hover { background: var(--panel); }
}
@media (prefers-reduced-motion: reduce) {
  .size-btn, .seg button { transition: background-color .15s ease; }
  .size-btn:active { transform: none; }
}
@media (max-width: 359px) {
  :root { --cell: 7.75rem; }
}
@media (min-width: 480px) {
  :root { --cell: 10.5rem; }
}
html.is-large { --cell: 9rem; }
@media (max-width: 420px) {
  html.is-large .row.go, html.is-large .row.off { grid-template-columns: 1fr; }
  html.is-large .row.go .cell, html.is-large .row.off .cell { border-right: 0; border-bottom: 2px solid var(--ink); flex-direction: row; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
}
</style>
</head>
<body>
<header class="band">
  <div class="band-in">
    <div>
      <p class="org">みどり台市 コミュニティバス</p>
      <h1>ぐるりんバス 時刻表</h1>
    </div>
    <button type="button" class="size-btn" id="sizeBtn" aria-pressed="false"><span class="box" aria-hidden="true"></span>文字を大きく</button>
  </div>
</header>

<main class="wrap">
  <div class="col-now">
    <section class="pick" aria-label="停留所">
      <label for="stop">のる停留所</label>
      <div class="select-wrap">
        <select id="stop"></select>
      </div>
      <p class="nowline"><span id="today"></span><span>いま <span class="clock" id="clock"></span></span><span class="dia" id="dia"></span></p>
    </section>

    <section aria-labelledby="next-h">
      <div class="sec-head"><h2 id="next-h">次のバス</h2></div>
      <p class="status" id="status" hidden></p>
      <ol class="plate" id="nextList" aria-describedby="next-dest"></ol>
      <p class="fineprint" id="next-dest"></p>
    </section>

    <section aria-labelledby="notice-h">
      <div class="sec-head"><h2 id="notice-h">運休・お知らせ</h2></div>
      <ul class="plate" id="noticeList"></ul>
    </section>
  </div>

  <section class="col-table" aria-labelledby="table-h">
    <div class="sec-head">
      <h2 id="table-h">時刻表</h2>
      <div class="seg" role="group" aria-label="ダイヤをえらぶ">
        <button type="button" data-type="weekday" aria-pressed="true">平日</button>
        <button type="button" data-type="holiday" aria-pressed="false">土日祝</button>
      </div>
    </div>
    <p class="tt-note" id="ttNote"></p>
    <p class="legend" id="legend">
      <span><span class="key next fig">16</span>次のバス</span>
      <span><span class="key past fig">16</span>発車ずみ</span>
      <span><span class="key off fig">16</span>運休</span>
    </p>
    <div class="plate">
      <table class="tt">
        <caption class="vh" id="ttCaption"></caption>
        <thead><tr><th scope="col">時</th><th scope="col">分</th></tr></thead>
        <tbody id="ttBody"></tbody>
      </table>
    </div>
  </section>

  <footer class="foot">
    <p>みどり台駅を出て市内をひと回りする右回りの循環バスです。</p>
    <p>時刻は道路の混み具合などで前後することがあります。年末年始（12月29日〜1月3日）は運休します。</p>
    <p>2026年10月1日 ダイヤ改正</p>
  </footer>
</main>

<script>
(() => {
  // Route: one loop from みどり台駅, minutes after the station departure.
  const STOPS = [
    ['みどり台駅', 0], ['駅前通り', 3], ['中央公園前', 6], ['市役所前', 9],
    ['図書館・公民館', 12], ['市民病院', 16], ['さくら台団地', 20], ['さくら台小学校', 23],
    ['ふれあいセンター', 27], ['農産物直売所', 31], ['東町集会所', 35], ['ショッピングセンター前', 39]
  ];
  const hm = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const TRIPS = {
    weekday: ['7:00','7:45','8:30','9:20','10:10','11:00','11:50','13:00','13:50','14:40','15:30','16:20','17:10','18:00','18:50','19:40'].map(hm),
    holiday: ['8:00','9:00','10:00','11:00','12:00','13:30','14:30','15:30','16:30','17:30','18:30'].map(hm)
  };
  const HOLIDAYS = new Set([
    '2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06',
    '2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23',
    '2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-21','2027-03-22','2027-04-29','2027-05-03','2027-05-04','2027-05-05',
    '2027-07-19','2027-08-11','2027-09-20','2027-09-23','2027-10-11','2027-11-03','2027-11-23'
  ]);
  // Cancellations by date and trip (station departure time). Applies to every stop on that trip.
  const CANCELS = [
    { date: '2026-11-01', trips: ['9:00', '10:00'].map(hm), why: '市民マラソン大会の交通規制のため' },
    { date: '2026-11-05', trips: ['13:00'].map(hm), why: '車両点検のため' }
  ];
  const NOTICES = [
    { kind: 'cancel', from: '2026-11-01', to: '2026-11-01', label: '運休', when: '11月1日(日)',
      text: '市民マラソン大会の交通規制のため、9時台・10時台にみどり台駅を出る便は全停留所で運休します。11時台の便から通常どおり運行します。' },
    { kind: 'change', from: '2026-11-02', to: '2026-11-13', label: 'のりば変更', when: '11月2日(月)〜13日(金)',
      text: '歩道工事のため、「中央公園前」は公園の向かい側、約50m 駅寄りの臨時のりばから発車します。時刻は変わりません。' },
    { kind: 'cancel', from: '2026-11-05', to: '2026-11-05', label: '運休', when: '11月5日(木)',
      text: '車両点検のため、13時00分にみどり台駅を出る便を運休します。' }
  ];
  const DOW = ['日', '月', '火', '水', '木', '金', '土'];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // Japan time regardless of the phone's time zone setting.
  function jstNow() {
    const d = new Date(Date.now() + 9 * 3600e3);
    return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), dow: d.getUTCDay(),
      min: d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60 };
  }
  function addDays(day, n) {
    const d = new Date(Date.UTC(day.y, day.mo - 1, day.d + n));
    return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), dow: d.getUTCDay() };
  }
  const pad = (n) => String(n).padStart(2, '0');
  const key = (day) => `${day.y}-${pad(day.mo)}-${pad(day.d)}`;
  const dayLabel = (day) => `${day.mo}月${day.d}日(${DOW[day.dow]})`;
  const clock = (m) => `${Math.floor(m / 60)}:${pad(m % 60)}`;
  function dayType(day) {
    if ((day.mo === 12 && day.d >= 29) || (day.mo === 1 && day.d <= 3)) return null;
    if (day.dow === 0 || day.dow === 6 || HOLIDAYS.has(key(day))) return 'holiday';
    return 'weekday';
  }
  const TYPE_NAME = { weekday: '平日ダイヤ', holiday: '土日祝ダイヤ' };
  function cancelOf(day, start) {
    const k = key(day);
    return CANCELS.find((c) => c.date === k && c.trips.includes(start)) || null;
  }

  // Next three running buses (cancelled trips in between are listed too, so nobody waits for them).
  function upcoming(stop, now) {
    const today = { y: now.y, mo: now.mo, d: now.d, dow: now.dow };
    const out = [];
    let running = 0;
    for (let k = 0; k < 10 && running < 3; k++) {
      const day = addDays(today, k);
      const t = dayType(day);
      if (!t) continue;
      const trips = TRIPS[t];
      for (let i = 0; i < trips.length && running < 3; i++) {
        const dep = trips[i] + STOPS[stop][1];
        const diff = k * 1440 + dep - now.min;
        if (diff < -0.5) continue;
        const c = cancelOf(day, trips[i]);
        out.push({ k, day, dep, diff, cancel: c, first: i === 0, last: i === trips.length - 1 });
        if (!c) running++;
      }
    }
    return out;
  }

  function countdown(diff) {
    const m = Math.floor(diff);
    if (m < 1) return '<span class="cd-soon">まもなく<br>発車</span>';
    if (m < 60) return `<span class="cd-pre">あと</span><span class="cd-val"><span class="cd-part"><b>${m}</b><span class="u">分</span></span></span>`;
    const h = Math.floor(m / 60), mm = m % 60;
    return `<span class="cd-pre">あと</span><span class="cd-val long"><span class="cd-part"><b>${h}</b><span class="u">時間</span></span> <span class="cd-part"><b>${mm}</b><span class="u">分</span></span></span>`;
  }
  function spoken(diff) {
    const m = Math.floor(diff);
    if (m < 1) return 'まもなく発車';
    if (m < 60) return `あと${m}分`;
    return `あと${Math.floor(m / 60)}時間${m % 60}分`;
  }
  const dest = (stop) => stop >= STOPS.length - 1 ? 'みどり台駅ゆき' : `${STOPS[stop + 1][0]} 経由 みどり台駅ゆき`;

  const state = { stop: 5, type: null };
  const savedStop = Number(store.get('gururin.stop'));
  if (Number.isInteger(savedStop) && savedStop >= 0 && savedStop < STOPS.length && store.get('gururin.stop') !== null) state.stop = savedStop;

  const sel = $('stop');
  sel.innerHTML = STOPS.map(([n], i) => `<option value="${i}">${esc(n)}</option>`).join('');
  sel.value = String(state.stop);

  function renderNow(now) {
    const today = { y: now.y, mo: now.mo, d: now.d, dow: now.dow };
    const t = dayType(today);
    $('today').textContent = dayLabel(today);
    $('clock').textContent = clock(Math.floor(now.min));
    $('dia').textContent = t ? TYPE_NAME[t] : '運休日（年末年始）';

    const list = upcoming(state.stop, now);
    const status = $('status');
    const todayHas = list.some((x) => x.k === 0);
    if (!t) { status.hidden = false; status.textContent = 'きょうは年末年始のため運休です。次に走るバスをお知らせします。'; }
    else if (!todayHas) { status.hidden = false; status.textContent = 'きょうの運行は終わりました。次は明日以降のバスです。'; }
    else status.hidden = true;

    $('nextList').innerHTML = list.map((x) => {
      const when = x.k === 0 ? '' : x.k === 1 ? '明日' : dayLabel(x.day);
      const tags = [when && `<span class="tag">${when}</span>`, x.first && '<span class="tag">始発</span>', x.last && '<span class="tag">最終</span>'].filter(Boolean).join(' ');
      if (x.cancel) {
        return `<li class="row off"><div class="cell"><span class="off-label">運休</span></div>
          <div class="body"><p class="dep"><span class="t">${clock(x.dep)}</span><span class="vh">発の便は</span>${tags}</p><p class="why">${esc(x.cancel.why)}</p></div></li>`;
      }
      return `<li class="row go"><div class="cell" aria-hidden="true">${countdown(x.diff)}</div>
        <div class="body"><p class="dep"><span class="vh">${when}${clock(x.dep)}発、${spoken(x.diff)}。</span><span class="t" aria-hidden="true">${clock(x.dep)}</span><span class="hatsu" aria-hidden="true">発</span>${tags ? `<span aria-hidden="true">${tags}</span>` : ''}</p></div></li>`;
    }).join('');
    $('next-dest').textContent = `「${STOPS[state.stop][0]}」から ${dest(state.stop)}`;

    // Notices: current and the coming two weeks.
    const tk = key(today), horizon = key(addDays(today, 14));
    const ns = NOTICES.filter((n) => n.to >= tk && n.from <= horizon);
    $('noticeList').innerHTML = ns.length ? ns.map((n) => {
      const isToday = n.from <= tk && n.to >= tk;
      return `<li class="row note ${n.kind}"><div class="cell"><span>${esc(n.label)}</span></div>
        <div class="body"><p class="n-when">${esc(n.when)}${isToday ? ' <span class="tag">きょう</span>' : ''}</p><p class="n-text">${esc(n.text)}</p></div></li>`;
    }).join('') : `<li class="row note none"><div class="cell"><span>なし</span></div><div class="body"><p class="n-text">いまのところ、運休やのりば変更の予定はありません。</p></div></li>`;

    if (!state.type) {
      const firstGo = list.find((x) => !x.cancel);
      state.type = (t && todayHas) ? t : (firstGo ? dayType(firstGo.day) : 'weekday');
    }
    renderTable(now, today, t, list);
  }

  function renderTable(now, today, t, list) {
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.type === state.type)));
    const off = STOPS[state.stop][1];
    const trips = TRIPS[state.type];
    const live = t === state.type && list.some((x) => x.k === 0);
    const next = live ? list.find((x) => x.k === 0 && !x.cancel) : null;
    const name = STOPS[state.stop][0];
    $('table-h').textContent = `「${name}」の時刻表`;
    $('ttCaption').textContent = `${name} ${TYPE_NAME[state.type]} の発車時刻`;
    $('ttNote').textContent = state.type === t
      ? `きょう ${dayLabel(today)} は${TYPE_NAME[t]}です。`
      : `${TYPE_NAME[state.type]}を表示しています。${t ? `きょうは${TYPE_NAME[t]}です。` : 'きょうは運休日です。'}`;

    const byHour = new Map();
    trips.forEach((start) => {
      const dep = start + off;
      const h = Math.floor(dep / 60);
      if (!byHour.has(h)) byHour.set(h, []);
      byHour.get(h).push({ dep, cancel: state.type === t ? cancelOf(today, start) : null });
    });
    $('ttBody').innerHTML = [...byHour].map(([h, ms]) => {
      const cells = ms.map(({ dep, cancel }) => {
        const mm = pad(dep % 60);
        if (cancel) return `<span class="m off"><span class="n">${mm}</span><span class="w">運休</span></span>`;
        if (next && dep === next.dep) return `<span class="m next">${mm}<span class="vh">（次のバス）</span></span>`;
        if (live && dep < now.min - 0.5) return `<span class="m past">${mm}<span class="vh">（発車ずみ）</span></span>`;
        return `<span class="m">${mm}</span>`;
      }).join('');
      return `<tr><th scope="row">${h}<span class="vh">時</span></th><td><span class="mins">${cells}</span></td></tr>`;
    }).join('');
  }

  function render() { renderNow(jstNow()); }

  sel.addEventListener('change', () => { state.stop = Number(sel.value); store.set('gururin.stop', sel.value); render(); });
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => { state.type = b.dataset.type; render(); }));

  const sizeBtn = $('sizeBtn');
  function applySize(on) { document.documentElement.classList.toggle('is-large', on); sizeBtn.setAttribute('aria-pressed', String(on)); }
  applySize(store.get('gururin.large') === '1');
  sizeBtn.addEventListener('click', () => { const on = sizeBtn.getAttribute('aria-pressed') !== 'true'; applySize(on); store.set('gururin.large', on ? '1' : '0'); });

  render();
  setInterval(render, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
