<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>軽い書体の読み込み</title>
<meta name="description" content="見出しの数文字だけを読み込み、本文はシステムの書体にした例">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&text=%E5%99%A8%E3%81%A8%E6%9A%AE%E3%82%89%E3%81%97&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --f-display: "Yuji Syuku", "Hiragino Mincho ProN", "Yu Mincho", serif; --f-size: 1.25; }
  body { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; line-height: 1.8; }
  h1 { font-family: var(--f-display); font-weight: 400; }
  h2 { font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; }
  code { font-family: "IBM Plex Mono", monospace; }
</style>
</head>
<body><main><h1>器と暮らし</h1><h2>工房のこと</h2><p>毎日の食卓で使う器をつくっています。<code>12:00</code></p></main></body>
</html>
