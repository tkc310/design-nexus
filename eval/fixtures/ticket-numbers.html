<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>t</title><meta name="description" content="t">

<body><main><h1>Board</h1><p id="s">Ready.</p><button id="b">Take the next ticket</button></main>
<script>
const s = document.getElementById('s');
document.getElementById('b').addEventListener('click', () => {
  s.textContent = 'You took #221, the Hale bakery quote.';

  s.title = '#224 is next';
  s.style.color = '#333';
});
