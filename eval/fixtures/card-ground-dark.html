<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dark card ground fixture</title>
<meta name="description" content="R33 fixture: lighter cards on a dark ground are not the light product default">
<style>
body{margin:0;font:15px/1.5 Georgia,serif;background:#1e2127;color:#e6e6e6}
main{padding:24px 32px}
h1{margin:0 0 16px;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#282c34;border:1px solid #3a3f4b;border-radius:8px;padding:20px;min-height:220px}
.card b{display:block;font-size:30px}
</style></head><body>
<main>
<h1>Build queue</h1>
<div class="grid">
<section class="card"><span>Running</span><b>3</b></section>
<section class="card"><span>Queued</span><b>12</b></section>
<section class="card"><span>Failed today</span><b>1</b></section>
<section class="card"><span>Median wait</span><b>48 s</b></section>
<section class="card"><span>Runners online</span><b>9</b></section>
<section class="card"><span>Cache hits</span><b>81%</b></section>
</div>
</main>
</body></html>
