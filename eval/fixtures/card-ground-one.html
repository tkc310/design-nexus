<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>One card on grey fixture</title>
<meta name="description" content="R33 fixture: one white card on a grey ground with no left sidebar; tiles inside it, a white top bar, a fixed save bar and one-row navs are not counted">
<style>
body{margin:0;font:15px/1.5 Georgia,serif;background:#f2f2f0;color:#1f2328}
header{display:flex;align-items:center;gap:24px;height:56px;padding:0 24px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
header nav a, .views a{margin-right:16px;color:#1f2328}
main{display:grid;grid-template-columns:400px 1fr;gap:24px;padding:24px 24px 96px}
h1{margin:0 0 8px;font-size:26px}
.card{background:#fff;border:1px solid #e1e1dc;border-radius:10px;padding:24px}
/* tiles sit on a grey inset inside the card: they belong to the card */
.inset{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:#f2f2f0;border-radius:6px;padding:16px}
.tile{background:#fff;border:1px solid #e1e1dc;border-radius:6px;padding:16px;min-height:150px}
.tile b{display:block;font-size:28px}
.savebar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:flex-end;padding:0 24px;background:#fff;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.savebar button{background:#1f4fd1;color:#fff;border:0;border-radius:6px;padding:10px 18px;font:inherit}
</style></head><body>
<!-- not counted: the white top bar; its nav is one row of links, not a sidebar -->
<header><strong>Plotline</strong><nav aria-label="Main"><a href="#projects">Projects</a><a href="#tasks">My tasks</a><a href="#reports">Reports</a></nav></header>
<main>
<div><h1>Weekly report</h1><p>What moved in your projects, and what is late.</p>
<nav class="views" aria-label="Range"><a href="#day">Day</a><a href="#week" aria-current="page">Week</a><a href="#month">Month</a></nav></div>
<section class="card"><h2>This week</h2>
<div class="inset">
<div class="tile"><span>Tasks closed</span><b>42</b></div>
<div class="tile"><span>Tasks late</span><b>5</b></div>
</div>
<p>Late tasks are listed under each project.</p></section>
</main>
<!-- not counted: a fixed save bar -->
<div class="savebar"><button type="button">Send report</button></div>
</body></html>
