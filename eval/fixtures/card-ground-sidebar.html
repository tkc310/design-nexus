<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Card ground beside a sidebar fixture</title>
<meta name="description" content="R33 fixture: a settings page whose work area is one white card on a grey ground beside a left sidebar">
<style>
body{margin:0;font:15px/1.5 Georgia,serif;background:#f4f4f4;color:#1f2328}
header{display:flex;align-items:center;height:56px;padding:0 24px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.shell{display:grid;grid-template-columns:220px 1fr}
nav.side{padding:24px 16px}
nav.side a{display:block;padding:8px 12px;color:#1f2328}
main{padding:32px;min-width:0}
h1{margin:0;font-size:26px}
main > p{margin:4px 0 24px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:24px;min-height:700px;margin-bottom:24px}
table{border-collapse:collapse;width:100%}
th,td{padding:12px 8px;border-bottom:1px solid #e0e0e0;text-align:left}
.savebar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:flex-end;padding:0 24px;background:#fff;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.savebar button{background:#7a1f4f;color:#fff;border:0;border-radius:6px;padding:10px 18px;font:inherit}
</style></head><body>
<header><strong>Fieldwork</strong></header>
<div class="shell">
<nav class="side" aria-label="Settings"><a href="#profile">Profile</a><a href="#notify" aria-current="page">Notifications</a><a href="#apps">Integrations</a><a href="#security">Security</a></nav>
<main>
<h1>Notifications</h1>
<p>Pick which project events reach you, and where.</p>
<!-- counted: one white card on the grey ground, beside the left sidebar -->
<section class="card"><h2>Events by channel</h2>
<table><thead><tr><th>Event</th><th>Email</th><th>Push</th><th>Slack</th></tr></thead><tbody>
<tr><td>Mentions</td><td><input type="checkbox" aria-label="Mentions by email" checked></td><td><input type="checkbox" aria-label="Mentions by push" checked></td><td><input type="checkbox" aria-label="Mentions in Slack" disabled></td></tr>
<tr><td>Assigned tasks</td><td><input type="checkbox" aria-label="Assigned tasks by email" checked></td><td><input type="checkbox" aria-label="Assigned tasks by push"></td><td><input type="checkbox" aria-label="Assigned tasks in Slack" disabled></td></tr>
<tr><td>Due-date reminders</td><td><input type="checkbox" aria-label="Reminders by email"></td><td><input type="checkbox" aria-label="Reminders by push" checked></td><td><input type="checkbox" aria-label="Reminders in Slack" disabled></td></tr>
<tr><td>Weekly digest</td><td><input type="checkbox" aria-label="Digest by email" checked></td><td><input type="checkbox" aria-label="Digest by push"></td><td><input type="checkbox" aria-label="Digest in Slack" disabled></td></tr>
</tbody></table></section>
<section class="card"><h2>Quiet hours</h2><p>Push and Slack hold until quiet hours end.</p></section>
</main>
</div>
<!-- not counted: a fixed save bar is app chrome -->
<div class="savebar"><button type="button">Save changes</button></div>
</body></html>
