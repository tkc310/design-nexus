<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixed bars</title>
<meta name="description" content="Fixture: a sticky header, a fixed save bar, an off-canvas drawer, and an empty fixed layer.">
<style>
  body { margin: 0; font: 16px/1.5 Georgia, serif; color: #111; background: #fff; }
  header { position: sticky; top: 0; background: #eee; padding: 12px 16px; }
  main { padding: 16px; }
  section { height: 700px; border-bottom: 1px solid #767676; }
  #save { position: fixed; left: 0; right: 0; bottom: 0; background: #8a0018; color: #fff; padding: 16px; }
  #save button { min-height: 44px; }
  #drawer { position: fixed; top: 0; right: 0; width: 280px; height: 100vh; transform: translateX(100%); background: #222; color: #fff; }
  #drawer a { display: block; min-height: 44px; color: #fff; }
  #grain { position: fixed; inset: 0; pointer-events: none; background: rgba(0, 0, 0, 0.02); }
</style>
</head>
<body>
  <header>Notification settings</header>
  <main>
    <section><h1>Channels</h1></section>
    <section><h2>Quiet hours</h2></section>
    <section><h2>Digest</h2></section>
    <section><h2>Slack</h2></section>
  </main>
  <div id="save">You have unsaved changes <button type="button">Save changes</button></div>
  <nav id="drawer" aria-label="Menu"><a href="#account">Account</a></nav>
  <div id="grain"></div>
</body>
</html>
