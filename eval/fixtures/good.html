<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>潮見表 — 今日の潮</title>
<meta name="description" content="港ごとの今日の潮位と満潮・干潮時刻">
<style>
  :root {
    --bg: #F3F6F7; --surface: #FFFFFF; --text: #1E2328; --muted: #4A5560;
    --accent: #0E6E7E; --on-accent: #FFFFFF; --border: #CFE3E6;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Source Serif 4", "Shippori Mincho", serif; font-size: 17px; line-height: 1.8; letter-spacing: 0.03em; }
  main { max-width: 68rem; margin: 0 auto; padding: 40px 16px; }
  h1, h2 { font-family: "Fraunces", "Shippori Mincho", serif; line-height: 1.35; text-wrap: balance; }
  .figures { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 24px; }
  a { color: var(--accent); }
  .action { display: inline-block; min-height: 44px; padding: 10px 20px; background: var(--accent); color: var(--on-accent);
    border: 0; border-radius: 2px; font: inherit; transition: transform 150ms var(--ease-out); }
  .action:active { transform: scale(0.97); }
  .action:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  label { display: block; }
  input { font: inherit; min-height: 44px; padding: 8px 12px; border: 1px solid var(--muted); border-radius: 2px; }
  svg { display: block; width: 100%; height: auto; }
  @media (prefers-reduced-motion: reduce) { .action { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <p class="figures">2026年10月30日(金) 横浜港</p>
    <h1>今日の満潮は 14:22、潮位 182cm</h1>
  </header>
  <svg viewBox="0 0 600 120" role="img" aria-label="今日の潮位曲線"><path d="M0 60 C100 0 200 0 300 60 S500 120 600 60" fill="none" stroke="#0E6E7E" stroke-width="3"/></svg>
  <section class="grid" aria-labelledby="times">
    <h2 id="times">満潮・干潮</h2>
    <p class="figures">満潮 02:10 / 14:22<br>干潮 08:05 / 20:41</p>
  </section>
  <form>
    <label for="port">港を選ぶ</label>
    <input id="port" name="port" autocomplete="off">
    <button class="action" type="submit">潮見表を表示する</button>
  </form>
  <p>データは<a href="https://example.org/">海上保安庁の公開データ</a>をもとにしています。</p>
</main>
</body>
</html>
