<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Action color ink fixture</title>
<meta name="description" content="R30 fixture: an action filled with the page's ink is not checked">
<style>
body{margin:0;font:17px/1.6 Georgia,serif;background:#f7f8fb;color:#173f8a}
main{max-width:860px;margin:0 auto;padding:24px}
.btn{background:#173f8a;color:#fff;border:0;border-radius:6px;padding:12px 20px;font:inherit}
.tag{border:1px solid #173f8a;border-radius:4px;padding:0 6px}
</style></head><body>
<main>
<h1>Harbor ferry timetable</h1>
<p>Boats leave the north pier every forty minutes from 6:20. The last boat back leaves the island at 22:40.</p>
<p><button class="btn" type="button" id="ticket">Buy a ticket</button></p>
<!-- not checked: the action is filled with the ink every line of text is set in, so its color is not an accent -->
<ul><li>6:20 <span class="tag">Daily</span></li><li>7:00 <span class="tag">Weekdays</span></li><li>7:40 <span class="tag">Daily</span></li></ul>
<p>Bikes ride free on every boat, and dogs ride free on a lead.</p>
</main></body></html>
