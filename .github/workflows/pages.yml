name: Publish fixture pages and gallery

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble fixture site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout でリポジトリを読む
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the assembler
        shell: bash
        run: node .github/assemble-fixture-pages.mjs --self-test

      - name: Assemble fixture site
        shell: bash
        run: node .github/assemble-fixture-pages.mjs

      - name: Add the improvement-loop gallery
        shell: bash
        run: |
          test -f eval/gallery/index.html
          mkdir -p _site/gallery
          cp -R eval/gallery/. _site/gallery/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write # Pages へデプロイする
      id-token: write # Pages の OIDC トークンを発行する
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages API を読む。build は contents: read だけなので、このジョブで実行する。
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
